# type: CI Helper - ChatOps
# owner: @camunda/engineering-operations
---
name: ChatOps Command Dispatch

on:
  issue_comment:
    types: [created]

jobs:
  dispatch-pr-command:
    if: ${{ github.event.issue.pull_request }}
    name: Dispatch PR Command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create URL to the run output
        id: vars
        run: |
          {
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Check Vault credentials
        id: vault-config
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          if [[ -n "${VAULT_ADDR}" && -n "${VAULT_ROLE_ID}" && -n "${VAULT_SECRET_ID}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping PR command dispatch because Vault credentials are unavailable."
          fi

      - name: Generate a GitHub token
        id: github-token
        if: ${{ steps.vault-config.outputs.configured == 'true' }}
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7fe5cca167f7826bedbc078ae36ff2e974cc8cb5 # generate-github-app-token-from-vault-secrets-1.1.2
        with:
          github-app-id-vault-key: GITHUB_OPTIMIZE_APP_ID
          github-app-id-vault-path: secret/data/products/optimize/ci/camunda-optimize
          github-app-private-key-vault-key: GITHUB_OPTIMIZE_APP_KEY
          github-app-private-key-vault-path: secret/data/products/optimize/ci/camunda-optimize
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID}}
          vault-url: ${{ secrets.VAULT_ADDR }}

      - name: Slash Command Dispatch
        if: ${{ steps.vault-config.outputs.configured == 'true' }}
        uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5.0.2
        with:
          token: ${{ steps.github-token.outputs.token }}
          reaction-token: ${{ steps.github-token.outputs.token }}
          issue-type: pull-request
          commands: |
            ci-problems
            ci-disable-cache
            ci-enable-cache

      - name: Update comment in case of failure
        if: failure()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            > Had issues fulfilling your command, check the [logs](${{ steps.vars.outputs.run_url }})
